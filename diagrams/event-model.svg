<text x="917.0" y="59.0" font-size="9" fill="#666" dominant-baseline="central">Automation</text>
<rect x="1021.0" y="52.0" width="12" height="12" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="0.5"/>
<text x="1037.0" y="59.0" font-size="9" fill="#666" dominant-baseline="central">Interface</text>
<rect x="142" y="72.0" width="436" height="36" rx="4" fill="#EDF2FA"/>
<text x="360.0" y="91.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1A73E8">Connect &amp; Scope</text>
<rect x="654" y="72.0" width="436" height="36" rx="4" fill="#EDF2FA"/>
<text x="872.0" y="91.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1A73E8">Agent Reads &amp; Drafts</text>
<rect x="1166" y="72.0" width="436" height="36" rx="4" fill="#EDF2FA"/>
<text x="1384.0" y="91.0" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1A73E8">Human Sends, Everything Logs</text>
<text x="241.0" y="130.0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#888" font-weight="500"><title>Admin names the connection and picks its scopes. This is the only place scopes get set.</title>Admin Creates a Connection ⓘ</text>
<text x="479.0" y="130.0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#888" font-weight="500"><title>Immediate. Every call from that connection is denied from this point on.</title>Admin Revokes a Connection ⓘ</text>
<text x="753.0" y="130.0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#888" font-weight="500"><title>Requires read scope. No state change.</title>Agent Reads Conversation ⓘ</text>
<text x="991.0" y="130.0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#888" font-weight="500"><title>Requires draft scope. Produces a draft only, never a message the customer sees.</title>Agent Drafts a Reply ⓘ</text>
<text x="1265.0" y="130.0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#888" font-weight="500"><title>The only command that reaches the customer. No agent connection can issue it.</title>Rep Reviews and Sends ⓘ</text>
<text x="1503.0" y="130.0" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#888" font-weight="500"><title>Admin sees connection, action, target, and time for every entry.</title>Every Scoped Action Is Logged ⓘ</text>
