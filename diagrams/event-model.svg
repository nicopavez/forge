<text x="841.0" y="28.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">External Agent Access to Front</text>
<text x="841.0" y="48.0" font-size="10" text-anchor="middle" fill="#777">The mechanism behind one claim: an agent can read and draft, only a human can send.</text>
<rect x="541.0" y="52.0" width="12" height="12" rx="2" fill="#5B8DEF"/>
<text x="557.0" y="59.0" font-size="9" fill="#666" dominant-baseline="central">Command</text>
